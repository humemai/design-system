name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: tokens, contrast, assets, CSS
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'

      - name: Install dependencies
        run: uv sync --locked

      - name: Check tokens, contrast pairs and asset sizes
        run: uv run python scripts/check.py

      - name: Check that the CSS parses
        run: uv run --no-project --with tinycss2==1.4.0 python -I scripts/check_css.py

      # Only the SVGs are compared. The PNGs and the ICO are rasterised by the
      # system libcairo and encoded by libpng and zlib, so their bytes can
      # differ between a laptop and the runner without any change to the
      # generator. The SVGs are plain text from pinned fontTools, HarfBuzz and
      # qrcode, so they are the same everywhere, and every PNG is drawn from one.
      - name: Check that logo/ and export/*.svg match scripts/build.py
        run: |
          uv run python scripts/build.py
          if [ -n "$(git status --porcelain -- logo 'export/*.svg')" ]; then
            git status --short -- logo 'export/*.svg'
            git diff --stat -- logo 'export/*.svg'
            echo "::error::logo/ or export/*.svg is out of sync with scripts/build.py. Run 'uv run python scripts/build.py' and commit the result."
            exit 1
          fi
